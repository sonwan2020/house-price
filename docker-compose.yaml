# Docker Compose entry point for the whole repo — run the full stack from
# the repository root with one command:
#   docker compose up -d            # start everything (builds if image is missing)
#   docker compose up -d --build    # rebuild images, then start
#   docker compose down             # stop and remove everything
#   docker compose logs -f api      # follow one service's logs
#
# Fresh clone? The image build trains the model automatically when
# app/models/house_price_model.joblib is missing (two-stage Dockerfile).
#
# The regression model is configurable via MODEL_TYPE (linear |
# linear_positive | ridge | lasso) and DROP_FEATURES (comma-separated
# features to exclude); defaults: linear_positive without lot_size.
# See .env.example and predict/README.md ("Model selection").
#
# Retrain after changing the training data (persists to the host, then
# rebuild to bake the new artifacts into the image):
#   docker compose run --rm --user root \
#     -v ./predict/app/models:/app/app/models \
#     api python scripts/train.py
#   docker compose up -d --build
#
# Compose interpolates ${VAR:-default} from ./.env at the repo root, so
# local overrides (API_PORT, MODEL_VERSION, MODEL_TYPE, DROP_FEATURES) live there.
#
# Adding a service later (database, worker, frontend, ...): add a sibling
# entry under `services:` with an `image:` tag, a `build:` context pointing
# at its own directory, ${VAR:-default} settings for ports/paths, and —
# where startup order matters — a depends_on with the health condition:
#   depends_on:
#     api:
#       condition: service_healthy

services:
  api:
    build:
      context: ./predict
      dockerfile: Dockerfile
      args:
        # Regression model trained into the image: linear | linear_positive |
        # ridge | lasso. linear_positive (non-negative OLS) without lot_size
        # was chosen for the dataset's collinearity — see predict/README.md.
        MODEL_TYPE: ${MODEL_TYPE:-linear_positive}
        DROP_FEATURES: ${DROP_FEATURES:-lot_size}
    image: house-price-api:latest
    container_name: house-price-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Reported by GET /api/v1/model-info; bump after retraining.
      MODEL_VERSION: ${MODEL_VERSION:-1.0}
      # Used by the on-demand retrain command (docker compose run ... train.py).
      MODEL_TYPE: ${MODEL_TYPE:-linear_positive}
      DROP_FEATURES: ${DROP_FEATURES:-lot_size}
    # The Dockerfile's HEALTHCHECK is inherited, so later services can
    # depend on `api: {condition: service_healthy}`.
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    image: house-price-portal:latest
    container_name: house-price-portal
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    environment:
      # The portal calls the APIs server-side over the internal network;
      # the browser never talks to the Python or Java services directly.
      PYTHON_API_URL: http://api:8000
      MARKET_API_URL: http://market-api:8080
    depends_on:
      api:
        condition: service_healthy
      market-api:
        condition: service_healthy
    restart: unless-stopped

  market-api:
    build:
      context: ./market
      dockerfile: Dockerfile
    image: house-price-market-api:latest
    container_name: house-price-market-api
    ports:
      - "${MARKET_PORT:-8080}:8080"
    environment:
      # The market service aggregates the dataset mounted below and calls
      # the ML container for what-if predictions over the internal network.
      PYTHON_API_URL: http://api:8000
      DATA_FILE: /data/House Price Dataset.csv
    volumes:
      - ./predict/data:/data:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
